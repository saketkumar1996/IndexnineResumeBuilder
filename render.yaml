services:
  - type: web
    name: indexnine-resume-builder-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      # MongoDB Atlas SRV connection string, e.g.
      # mongodb+srv://user:pass@cluster.mongodb.net/indexnine_resume_builder
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_SECURE
        value: "true"
      - key: SESSION_SAMESITE
        value: "none"
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_REDIRECT_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-4o-mini
