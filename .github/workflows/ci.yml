name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Builds from a clean checkout, so anything present only on a developer's
  # machine (e.g. a source file excluded by .gitignore) fails here rather than
  # in the Vercel deploy.
  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    # TODO: drop continue-on-error once the 8 validation/auth-flow tests left
    # stale by the expertise word-count refactor are updated.
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run test:run

  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    # TODO: drop continue-on-error once the 9 rendering/model-validation tests
    # are updated.
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      # Exercises the same import path Render uses at startup, so a missing
      # dependency or import error surfaces before deploy.
      - name: Verify app imports
        run: python -c "import main; print('ok')"

      - run: pytest -q
